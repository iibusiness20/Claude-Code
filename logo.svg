<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 72" width="400" height="72">

  <!-- Abstract mark: 3 descending bars = "Index" concept -->
  <rect x="0" y="8"  width="46" height="12" rx="6" fill="#1e3a8a"/>
  <rect x="0" y="27" width="34" height="12" rx="6" fill="#4338ca"/>
  <rect x="0" y="46" width="22" height="12" rx="6" fill="#7c3aed"/>

  <!-- Text: THE UK -->
  <text x="62" y="20"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="10" font-weight="400" letter-spacing="4"
        fill="#1e3a8a">THE UK</text>

  <!-- Text: SUBSCRIPTION (main, bold) -->
  <text x="62" y="42"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="20" font-weight="700" letter-spacing="0.5"
        fill="#1e3a8a">SUBSCRIPTION</text>

  <!-- Text: INDEX (purple, wide tracking) -->
  <text x="62" y="60"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="11" font-weight="300" letter-spacing="7"
        fill="#7c3aed">INDEX</text>

</svg>
