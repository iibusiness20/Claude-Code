<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 108" width="600" height="108">

  <!-- Abstract mark: 3 descending bars (1.5x scaled) -->
  <rect x="0" y="12"  width="69" height="18" rx="9" fill="#1e3a8a"/>
  <rect x="0" y="40"  width="51" height="18" rx="9" fill="#4338ca"/>
  <rect x="0" y="68"  width="33" height="18" rx="9" fill="#7c3aed"/>

  <!-- THE UK: bold, small caps, navy -->
  <text x="93" y="28"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="700" letter-spacing="5"
        fill="#1e3a8a">THE UK</text>

  <!-- SUBSCRIPTION: bold, prominent -->
  <text x="93" y="57"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="1"
        fill="#1e3a8a">SUBSCRIPTION</text>

  <!-- INDEX: bold, purple, wide tracking, 80% of SUBSCRIPTION size (24px) -->
  <text x="93" y="82"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700" letter-spacing="9"
        fill="#7c3aed">INDEX</text>

</svg>
